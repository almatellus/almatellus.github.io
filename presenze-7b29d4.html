<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b3440">
<title>Conta visitatori - Alma Tellus</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ec;color:#0b3440;font-family:Arial,Helvetica,sans-serif}main{max-width:480px;margin:0 auto;padding:24px 18px}.brand{margin:0 0 24px;font-size:13px;font-weight:bold;letter-spacing:2px}h1{font-size:28px;margin:0 0 10px}.date{margin:0 0 18px;color:#4a666b;font-size:16px}.card{background:#fff;border:1px solid #d8e0da;border-radius:16px;text-align:center;padding:18px 8px;margin-bottom:16px}#count{display:block;color:#0b3440;font-size:100px;font-weight:bold;line-height:1.2;overflow-wrap:break-word}.label{margin:4px 0 8px;color:#4a666b;font-size:16px}button,input{font-family:inherit;touch-action:manipulation}button{cursor:pointer;border-radius:12px}button:focus-visible,input:focus-visible{outline:3px solid #c5a15a;outline-offset:3px}button:disabled{opacity:.5;cursor:default}#add{display:block;width:100%;min-height:132px;padding:28px 8px;border:0;background:#0b3440;color:#fff;font-weight:bold;font-size:31px}#add:active{background:#205463}.controls{margin:14px 0}.small{width:48%;min-height:50px;padding:10px 4px;border:1px solid #bacac3;background:#fff;color:#0b3440;font-size:14px;font-weight:bold}.right{float:right}.total{margin:20px 0 12px;padding:16px;background:#e5ede8;border-radius:12px;font-size:17px}#total{float:right;font-weight:bold}#status{font-size:13px;line-height:1.5;color:#4a666b;min-height:40px}.note{font-size:12px;line-height:1.5;color:#4a666b}#editBox{display:none;padding:18px 14px;background:#fff;border:1px solid #c6d2cb;border-radius:12px;margin:14px 0}label{display:block;font-size:16px;font-weight:bold}input{display:block;width:100%;margin:12px 0;padding:12px;border:1px solid #94aba0;font-size:26px;border-radius:8px}#error{color:#a12820;font-size:14px}.save{background:#0b3440;color:#fff;border-color:#0b3440}#export{display:block;width:100%;min-height:44px;padding:10px;border:1px solid #bacac3;color:#0b3440;background:transparent;font-size:14px}
</style>
</head>
<body style="margin:0;background-color:#f7f4ec;color:#0b3440">
<main>
<p class="brand">ALMA TELLUS · MAKER FAIRE</p>
<h1>Conta visitatori</h1>
<p class="date" id="date">Visitatori di oggi</p>
<section class="card" aria-label="Conteggio di oggi"><output id="count" aria-live="polite" aria-atomic="true">0</output><p class="label">visitatori contati oggi</p></section>
<button id="add" type="button" disabled>+1 visitatore</button>
<div class="controls"><button id="minus" class="small" type="button" disabled>−1 · Correggi</button><button id="edit" class="small right" type="button" disabled>Imposta conteggio</button></div>
<form id="editBox">
<label for="number">Visitatori già contati oggi</label>
<input id="number" type="number" inputmode="numeric" min="0" max="999999" step="1" required>
<p id="error" role="alert"></p>
<button class="small" id="cancel" type="button">Annulla</button><button class="small right save" type="submit">Salva</button>
</form>
<p class="total">Totale registrato <span id="total">0</span></p>
<p id="status" role="status">Caricamento del contatore…</p>
<button id="export" type="button" disabled>Scarica riepilogo</button>
<p class="note">Il conteggio resta in questo browser. Ogni telefono conta separatamente. Scarica il riepilogo per conservarne una copia.</p>
<noscript><p>Per contare i visitatori, abilita JavaScript nel browser.</p></noscript>
</main>
<script>
(function () {
'use strict';
var KEY = 'almatellus.stand.visitors.v1';
var state = {version:1, days:{}, updatedAt:null};
var canSave = true, editingDay = '', LIMIT = 999999;
function el(id) { return document.getElementById(id); }
function dayKey() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function total() { var sum=0, keys=Object.keys(state.days), i; for(i=0;i<keys.length;i++) sum+=state.days[keys[i]]; return sum; }
function read() {
var raw=localStorage.getItem(KEY); if(raw===null) return {version:1,days:{},updatedAt:null};
var data=JSON.parse(raw), keys, i, value;
if(!data || data.version!==1 || !data.days || typeof data.days!=='object' || Array.isArray(data.days)) throw new Error('Invalid data');
keys=Object.keys(data.days);
for(i=0;i<keys.length;i++) { value=data.days[keys[i]]; if(!/^\d{4}-\d{2}-\d{2}$/.test(keys[i]) || typeof value!=='number' || !isFinite(value) || Math.floor(value)!==value || value<0 || value>LIMIT) throw new Error('Invalid count'); }
return data;
}
function render() {
var key=dayKey(), value=state.days[key]||0;
el('date').textContent='Oggi · '+key.slice(8)+'/'+key.slice(5,7)+'/'+key.slice(0,4);
el('count').textContent=String(value); el('total').textContent=String(total());
el('add').disabled=value>=LIMIT; el('minus').disabled=value===0;
el('status').textContent=canSave?'Conteggio salvato su questo telefono.':'Salvataggio non disponibile: il conteggio resta solo finché questa pagina rimane aperta. Scarica il riepilogo prima di chiuderla.';
}
function refresh() { if(canSave) { try { state=read(); } catch(err) { canSave=false; } } render(); }
function change(delta,absolute) {
if(canSave) { try { state=read(); } catch(err) { canSave=false; } }
var key=dayKey(), value=typeof absolute==='number'?absolute:(state.days[key]||0)+delta;
state.days[key]=Math.max(0,Math.min(LIMIT,value)); state.updatedAt=new Date().toISOString();
if(canSave) { try { localStorage.setItem(KEY,JSON.stringify(state)); } catch(err) { canSave=false; } }
render();
}
el('add').onclick=function(){change(1);};
el('minus').onclick=function(){change(-1);};
el('edit').onclick=function(){ refresh(); editingDay=dayKey(); el('number').value=String(state.days[editingDay]||0); el('error').textContent=''; el('editBox').style.display='block'; el('number').focus(); el('number').select(); };
el('cancel').onclick=function(){el('editBox').style.display='none';};
el('editBox').onsubmit=function(event){
event.preventDefault(); var raw=el('number').value, value=Number(raw);
if(!raw || !isFinite(value) || value<0 || value>LIMIT || Math.floor(value)!==value){ el('error').textContent='Inserisci un numero intero tra 0 e 999999.'; return; }
if(editingDay!==dayKey()){el('error').textContent='È cambiato il giorno: riapri Imposta conteggio.';return;}
change(0,value); el('editBox').style.display='none';
};
el('export').onclick=function(){
refresh(); var keys=Object.keys(state.days).sort(), lines=['Data;Visitatori'], i;
if(keys.indexOf(dayKey())===-1){keys.push(dayKey());keys.sort();}
for(i=0;i<keys.length;i++)lines.push(keys[i]+';'+(state.days[keys[i]]||0));
lines.push('Totale;'+total());
var blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
var url=URL.createObjectURL(blob), link=document.createElement('a'); link.href=url;link.download='visitatori-alma-tellus-'+dayKey()+'.csv';
document.body.appendChild(link);link.click();document.body.removeChild(link);setTimeout(function(){URL.revokeObjectURL(url);},1000);
};
try{state=read();localStorage.setItem(KEY+'.probe','1');localStorage.removeItem(KEY+'.probe');}catch(err){canSave=false;}
el('edit').disabled=false;el('export').disabled=false;render();
window.addEventListener('storage',function(event){if(event.key===KEY || event.key===null)refresh();});
window.addEventListener('focus',refresh);
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh();});
setInterval(refresh,30000);
}());
</script>
</body>
</html>
