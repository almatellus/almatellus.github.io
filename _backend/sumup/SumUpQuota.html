<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><base target="_blank">
<style>*{box-sizing:border-box}body{margin:0;background:#f2f6f4;color:#183942;font:16px Arial,sans-serif}main{max-width:540px;margin:32px auto;padding:32px 24px;background:white;border:1px solid #d9e8e2;border-radius:20px}header{font-weight:800;letter-spacing:.12em;color:#14664e;font-size:13px}h1{font-size:30px;line-height:1.15;margin:22px 0 12px}p{line-height:1.6}.amount{font-size:42px;font-weight:800;color:#103f4c;margin:22px 0}a.pay,button{display:block;width:100%;border:0;border-radius:12px;padding:16px;background:#14664e;color:white;text-decoration:none;text-align:center;font:700 17px Arial;cursor:pointer}.secondary{margin-top:14px;background:#e8f3ed;color:#14664e;font-size:14px}button:disabled{opacity:.55;cursor:wait}.note{font-size:13px;color:#617876}.error{color:#9a3d29;background:#fff4f0;padding:16px;border-radius:12px}[hidden]{display:none!important}a:focus-visible,button:focus-visible{outline:3px solid #c8a15a;outline-offset:3px}@media(max-width:600px){main{margin:16px;border-radius:16px;padding:26px 20px}}</style></head>
<body><main><header>ALMA TELLUS</header><h1 id="title">Quota associativa</h1><p id="member"></p><p id="amount" class="amount" hidden></p><p id="status" role="status" aria-live="polite">Preparazione del pagamento…</p><a id="pay" class="pay" hidden rel="noreferrer noopener">Paga con SumUp</a><button id="check" class="secondary" hidden>Verifica pagamento</button><p class="note">Conserva questa email: il tuo link personale rimane valido. La tessera ha validità di 12 mesi dal pagamento.</p><p class="note">Per assistenza: <a href="mailto:info@almatellus.it">info@almatellus.it</a>.</p></main>
<script>'use strict';const token='<?!= token ?>';const $=id=>document.getElementById(id);let busy=false;let timer=null;
function fail(error){busy=false;$('check').disabled=false;$('status').className='error';$('status').textContent=error&&error.message?error.message:'Pagamento non disponibile. Riapri questo link fra poco.';$('pay').hidden=true;$('check').hidden=false;}
function show(data){busy=false;$('check').disabled=false;$('status').className='';$('member').textContent='Socio n. '+data.number;$('amount').textContent=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(data.amount);$('amount').hidden=false;if(data.paid){$('title').textContent='Quota già pagata';$('status').textContent='Grazie! Il pagamento della tua quota risulta registrato.';$('pay').hidden=true;$('check').hidden=true;if(timer)clearInterval(timer);return;}if(data.expired){$('pay').hidden=true;$('status').textContent='Preparazione del pagamento…';busy=true;google.script.run.withSuccessHandler(show).withFailureHandler(fail).sumupQuotaAvvia(token);return;}$('status').textContent='Completa il pagamento sulla pagina sicura di SumUp.';$('check').hidden=false;if(data.url&&/^https:\/\/checkout\.sumup\.com\/pay\/[A-Za-z0-9_-]+$/.test(data.url)){$('pay').href=data.url;$('pay').hidden=false;}if(!timer){let polls=0;timer=setInterval(()=>{if(++polls>120){clearInterval(timer);timer=null;return;}if(!document.hidden&&!busy)check();},10000);}}
function check(){if(busy)return;busy=true;$('check').disabled=true;google.script.run.withSuccessHandler(show).withFailureHandler(fail).sumupQuotaStato(token);}
$('check').addEventListener('click',()=>{if($('pay').hidden&&!busy){busy=true;google.script.run.withSuccessHandler(show).withFailureHandler(fail).sumupQuotaAvvia(token);}else check();});
$('pay').addEventListener('click',()=>{$('status').textContent='Dopo aver pagato torna qui per verificare la quota.';});
busy=true;google.script.run.withSuccessHandler(show).withFailureHandler(fail).sumupQuotaAvvia(token);
</script></body></html>
