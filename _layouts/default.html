<!doctype html>
<html lang="{{ site.lang | default: 'it' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3440">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="it_IT">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{{ page.og_title | default: page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.og_description | default: page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.og_image | default: '/logo.png' | absolute_url }}">
  {% if page.og_image_alt %}<meta property="og:image:alt" content="{{ page.og_image_alt | escape }}">{% endif %}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.og_title | default: page.title | default: site.title | escape }}">
  <meta name="twitter:description" content="{{ page.og_description | default: page.description | default: site.description | escape }}">
  <meta name="twitter:image" content="{{ page.og_image | default: '/logo.png' | absolute_url }}">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="icon" href="{{ '/logo.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=home-balance-2026">
  {% if page.extra_css %}<link rel="stylesheet" href="{{ page.extra_css | relative_url }}">{% endif %}
  <script defer src="{{ '/config.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/site.js' | relative_url }}?v=home-balance-2026"></script>
</head>
<body class="{{ page.body_class | default: '' }}">
  <a class="skip-link" href="#contenuto">Vai al contenuto</a>
  {% include header.html %}
  <main id="contenuto">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
