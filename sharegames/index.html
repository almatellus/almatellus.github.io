<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShareGames - Alma Tellus</title>
<style>
:root{--bg:#f4f1e8;--card:#fffdf7;--ink:#18231e;--mut:#66736b;--g:#255f4c;--line:#ded8c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}main{width:min(1220px,calc(100% - 32px));margin:auto;padding:48px 0}h1{margin:8px 0 10px;font:700 clamp(42px,7vw,74px)/.95 Georgia,serif}header{max-width:820px;margin-bottom:26px}header b{color:var(--g);font-size:12px;letter-spacing:.18em;text-transform:uppercase}header p{color:var(--mut);font-size:18px;line-height:1.5}.controls{position:sticky;top:10px;z-index:5;display:grid;grid-template-columns:1.7fr 1fr 1.3fr auto;gap:14px;align-items:end;margin:20px 0;padding:16px;border:1px solid var(--line);border-radius:18px;background:#fffdf7ee;box-shadow:0 12px 32px #263d2b16}label{display:block;color:var(--mut);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}input,select,textarea{width:100%;margin-top:6px;border:1px solid #cdc7b8;border-radius:10px;background:white;padding:0 12px;font:15px Arial,sans-serif}input,select{height:44px}textarea{height:82px;padding:10px 12px;resize:vertical}.count{min-width:100px;border-left:1px solid #ddd;padding-left:14px}.count strong{font:28px Georgia,serif}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 8px 26px #263d2b0d}.photo{position:relative;width:100%;height:235px;padding:0;border:0;background:#ddd;cursor:zoom-in;display:block;overflow:hidden}.photo svg{width:100%;height:100%;display:block}.open{position:absolute;right:10px;bottom:10px;padding:7px 10px;border-radius:99px;background:#16211dcc;color:white;font-size:12px}.body{padding:18px}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#e3eee7;color:var(--g);font-size:11px;font-weight:800;text-transform:uppercase}h2{margin:10px 0 8px;font:700 24px/1.05 Georgia,serif}.card p{min-height:56px;margin:0 0 14px;color:#4f5b55;line-height:1.45}.req,.primary{border:0;border-radius:999px;background:var(--g);color:white;font-weight:800;cursor:pointer}.req{min-height:40px;padding:0 18px}.primary,.sec{min-height:40px;padding:0 16px}.modal,.light{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:#0b100eea}.modal[hidden],.light[hidden],.empty[hidden]{display:none!important}.box{width:min(520px,100%);border-radius:18px;background:var(--card);padding:22px;box-shadow:0 24px 70px #0008}.box h3{margin:0 0 8px;font:700 30px/1 Georgia,serif}.box p{color:var(--mut)}.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.sec{border:1px solid #cfc7b8;border-radius:999px;background:white;color:var(--ink);font-weight:800;cursor:pointer}.stage{position:relative;width:min(calc(100vw - 48px),calc((100vh - 110px)*.75));aspect-ratio:3/4}.stage img{width:100%;height:100%;object-fit:contain;border-radius:10px}.ptr{position:absolute;display:grid;place-items:center;width:72px;height:72px;border:4px solid white;border-radius:50%;background:linear-gradient(145deg,#ffcf33,#ff4c36);box-shadow:0 0 0 5px #ff4c36aa,0 10px 24px #0009;font-size:46px;pointer-events:none;animation:p .7s infinite alternate}.stage .ptr{width:86px;height:86px;font-size:58px}@keyframes p{from{transform:translate(-50%,-110%) rotate(-5deg)}to{transform:translate(-50%,-130%) rotate(5deg) scale(1.08)}}.close{position:fixed;top:16px;right:20px;width:44px;height:44px;border:1px solid #ffffff66;border-radius:50%;background:#18221ecc;color:white;font-size:30px;cursor:pointer}figcaption{margin-top:10px;color:white;text-align:center;font-weight:700}footer{margin-top:34px;padding-top:18px;border-top:1px solid #d8d2c3;color:var(--mut);font-size:13px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{width:calc(100% - 20px)}.grid,.controls{grid-template-columns:1fr}.controls{position:static}.photo{height:260px}}
</style>
</head>
<body>
<main>
<header><b>ShareGames Alma Tellus</b><h1>ShareGames</h1><p>Catalogo condiviso dei giochi messi a disposizione dai soci Alma Tellus. Se compare il pulsante <b>RICHIEDI</b>, il gioco è disponibile per la richiesta.</p></header>
<section class="controls"><label>Cerca<input id="q" placeholder="Titolo, descrizione o categoria"></label><label>Categoria<select id="cat"><option value="">Tutte</option></select></label><label>Gioco<select id="game"><option value="">Tutti i giochi</option></select></label><div class="count"><strong id="count">0</strong><span> giochi</span></div></section>
<section id="grid" class="grid"></section><p id="empty" class="empty" hidden>Nessun risultato.</p><footer>ShareGames Alma Tellus • Completezza e funzionamento da verificare.</footer>
</main>
<div id="light" class="light" hidden><button id="close" class="close">×</button><figure><div class="stage"><img id="big" alt=""><span id="bigptr" class="ptr">👇</span></div><figcaption id="cap"></figcaption></figure></div>
<div id="modal" class="modal" hidden><div class="box"><h3>Richiedi gioco</h3><p id="mt"></p><label>Nome<input id="rn" autocomplete="name"></label><label>Email<input id="re" type="email" autocomplete="email"></label><label>Messaggio facoltativo<textarea id="rm" placeholder="Eventuali note"></textarea></label><div class="acts"><button id="cancel" class="sec">Annulla</button><button id="send" class="primary">Invia richiesta</button></div></div></div>
<script>
const IMG={1:'../assets/sharegames/foto-1.jpg',2:'../assets/sharegames/foto-2.jpg',3:'../assets/sharegames/foto-3.jpg'},MAIL='presidente@almatellus.it',RH=133.333;
const G=[
['Flash','Azione','Sparapalline da tavolo: recupero e attacco.',1,16,69],['Spin Arena','Azione','Sfida con supertrottole da lanciare nell\'arena.',1,34,70],['Bingo Delux','Classici','Bingo con 90 palline numerate.',1,43,70],['I piccoli dottori','Educativi','Gioco di abilità a tema medico.',1,54,69],['Monopoly, scatola rossa','Strategia','Classico gioco immobiliare Hasbro.',1,65,70],['Paroliere','Parole','Gioco delle parole nascoste.',1,75,71],['Il Diario delle Principesse','Creativi','Diario e attività Disney Princess.',1,84,70],['Carte miste','Carte','Scatola con carte di ogni genere.',1,91,73],['Risiko!','Strategia','Classico gioco strategico Editrice Giochi.',1,94,87],['Giorno di Paga','Strategia','Edizione da viaggio Parker.',1,90,95],
['Gioco di calcio elettronico','Elettronici','Campo con calciatori, segnapunti e palloncini.',2,12,18],['Flipper Space Planet','Elettronici','Flipper da tavolo con contatore meccanico.',2,32,18],['LEGO, contenitore rosso','Costruzioni','Contenitore rosso con mattoncini LEGO.',2,50,22],['Dama / scacchi piccola rossa','Classici','Piccola confezione rossa per dama e scacchi.',2,67,23],['Dama e scacchi 3 in 1','Classici','Gioco 3 in 1 con dama e scacchi.',2,86,22],['Salva le Scimmie','Abilità','Rimuovere i bastoncini senza far cadere le scimmie.',2,5,76],['Cubix Race','Costruzioni','Costruzioni compatibili a tema gara.',2,17,79],['Giochi Riuniti','Raccolte','Raccolta Lisciani con più di 60 giochi.',2,27,77],['Scarabeo','Parole','Classico gioco di composizione delle parole.',2,39,79],['Affari Tuoi Elettronico','Elettronici','Gioco televisivo elettronico per 1-4 giocatori.',2,50,78],['The White Stallion','Puzzle','Puzzle Clementoni fluorescente da 1000 pezzi.',2,62,78],['Eddy\'s Magic','Magia','Confezione deluxe con 30 giochi di prestigio.',2,75,80],
['Jenga','Abilità','Gioco della torre in legno.',3,47,18],['Mikado Shanghai','Classici','Gioco di destrezza con bastoncini.',3,58,18],['Domino, scatola in legno','Classici','Set di tessere in contenitore in legno.',3,59,30],['Domino Dal Negro, scatola bianca','Classici','Domino Dal Negro in scatola bianca.',3,89,18],['Europa - I Puzzle Geografici','Puzzle','Puzzle geografico Clementoni da 104 pezzi.',3,49,9],['Monopoli, edizione vintage','Strategia','Vecchia edizione italiana in scatola beige.',3,8,88],['La Città delle Regole','Educativi','Gioco dell\'oca della legalità, Lisciani.',3,21,88],['Mercante in Fiera','Carte','Gioco tradizionale di carte, da verificare.',3,35,91],['Carte Dal Negro','Carte','Carte plastificate, edizione da verificare.',3,42,91],['Twister Moves - High School Musical 2','Movimento','Gioco musicale e di movimento MB.',3,53,88],['Il Gioco del Labirinto','Abilità','Labirinto in legno da inclinare.',3,62,88],['La Tombola Automatica','Classici','Tombola Clementoni con 48 cartelle.',3,76,90],['Educazione Stradale','Educativi','Sapientino sulle regole della strada, 5-7 anni.',3,89,89],['Palla trasformabile','Azione','Palla nera e fucsia, modello da identificare.',3,20,45],['Parole Parole Parole','Parole','Luxury Version del gioco a parole Play Family.',3,28,70],['Luna Park','Società','Il grande gioco a squadre di Raiuno, 14+.',3,30,79]
];
const $=s=>document.querySelector(s),q=$('#q'),cat=$('#cat'),game=$('#game'),grid=$('#grid'),count=$('#count'),empty=$('#empty'),light=$('#light'),big=$('#big'),bigptr=$('#bigptr'),cap=$('#cap'),modal=$('#modal'),mt=$('#mt'),rn=$('#rn'),re=$('#re'),rm=$('#rm');let sel='',cur=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s).toLocaleLowerCase('it');
function cats(){[...new Set(G.map(x=>x[1]))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>cat.add(new Option(x,x)))}
function games(){let a=G.filter(x=>!cat.value||x[1]===cat.value).sort((a,b)=>a[0].localeCompare(b[0],'it'));game.innerHTML='<option value="">Tutti i giochi</option>'+a.map(x=>`<option>${esc(x[0])}</option>`).join('');game.value=sel}
function crop(x,y){let w=34,h=23,cx=x,cy=y*RH/100,vx=Math.max(0,Math.min(100-w,cx-w/2)),vy=Math.max(0,Math.min(RH-h,cy-h/2));return [vx,vy,w,h,cx,cy]}
function thumb(g,i){let c=crop(g[4],g[5]);return `<button class="photo" data-i="${i}" aria-label="Apri foto di ${esc(g[0])}"><svg viewBox="${c[0]} ${c[1]} ${c[2]} ${c[3]}" preserveAspectRatio="xMidYMid slice"><image href="${IMG[g[3]]}" x="0" y="0" width="100" height="${RH}" preserveAspectRatio="none"/><circle cx="${c[4]}" cy="${c[5]}" r="4.2" fill="#ff4c36" stroke="white" stroke-width="1.3"/><text x="${c[4]}" y="${c[5]+1.8}" text-anchor="middle" font-size="8">👇</text></svg><span class="open">Apri foto</span></button>`}
function rows(){let t=norm(q.value),a=G.filter(x=>(!cat.value||x[1]===cat.value)&&(!sel||x[0]===sel)&&(!t||norm(`${x[0]} ${x[1]} ${x[2]}`).includes(t)));count.textContent=a.length;empty.hidden=!!a.length;grid.innerHTML=a.map(x=>{let i=G.indexOf(x);return `<article class="card">${thumb(x,i)}<div class="body"><span class="tag">${esc(x[1])}</span><h2>${esc(x[0])}</h2><p>${esc(x[2])}</p><button class="req" data-i="${i}">RICHIEDI</button></div></article>`}).join('');grid.querySelectorAll('.photo').forEach(b=>b.onclick=()=>openPhoto(G[+b.dataset.i]));grid.querySelectorAll('.req').forEach(b=>b.onclick=()=>openReq(G[+b.dataset.i]))}
function openPhoto(g){big.src=IMG[g[3]];bigptr.style.left=g[4]+'%';bigptr.style.top=g[5]+'%';cap.textContent='Il dito indica: '+g[0];light.hidden=false;document.body.style.overflow='hidden'}
function closePhoto(){light.hidden=true;document.body.style.overflow=''}
function openReq(g){cur=g;mt.textContent='Gioco richiesto: '+g[0];rn.value='';re.value='';rm.value='';modal.hidden=false;rn.focus()}
function sendReq(){if(!cur)return;let name=rn.value.trim(),email=re.value.trim();if(!name||!email){alert('Inserisci nome ed email.');return}let subject='Richiesta ShareGames - '+cur[0],body=`Ciao Bruno,%0D%0A%0D%0Avorrei richiedere questo gioco ShareGames:%0D%0A%0D%0AGioco: ${encodeURIComponent(cur[0])}%0D%0ANome: ${encodeURIComponent(name)}%0D%0AEmail: ${encodeURIComponent(email)}%0D%0AMessaggio: ${encodeURIComponent(rm.value.trim()||'-')}%0D%0A%0D%0AGrazie.`;let gmail=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(MAIL)}&su=${encodeURIComponent(subject)}&body=${body}`;window.open(gmail,'_blank');modal.hidden=true}
q.oninput=()=>{sel='';game.value='';rows()};cat.onchange=()=>{sel='';q.value='';games();rows()};game.onchange=()=>{sel=game.value;q.value=sel;rows()};$('#close').onclick=closePhoto;light.onclick=e=>{if(e.target===light)closePhoto()};$('#cancel').onclick=()=>modal.hidden=true;$('#send').onclick=sendReq;document.onkeydown=e=>{if(e.key==='Escape'){closePhoto();modal.hidden=true}};cats();games();rows();
</script>
</body>
</html>
