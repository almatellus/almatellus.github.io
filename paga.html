<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Quota associativa · Alma Tellus</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6f4;color:#183942;font:16px Arial,sans-serif}iframe{display:block;border:0;width:100%;min-height:100dvh}main{max-width:540px;margin:48px auto;padding:24px}h1{font-size:30px}p{line-height:1.6}a{color:#14664e}</style></head><body><main id="message"><h1>Quota associativa Alma Tellus</h1><p>Apri il link personale ricevuto nell’email di accettazione per pagare la tua quota.</p><p>Per assistenza: <a href="mailto:info@almatellus.it">info@almatellus.it</a>.</p></main><script>
