<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Atletico Ascoli | Gestione convocati</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#162b23;background:#eef3ef}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 12px;background:#e4eee8;color:#153c2b}button.primary{background:#126b47;color:white}button:disabled{opacity:.4}header{background:#115b3c;color:white;padding:16px 18px;font-size:21px;font-weight:750}nav{display:flex;gap:5px;padding:8px;background:white;position:sticky;top:0;z-index:5;overflow:auto}nav button{white-space:nowrap;flex:1;padding:10px 8px}nav .on{background:#146b48;color:white}.wrap{max-width:1450px;margin:auto;padding:12px}.panel{background:white;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #183a2910}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:8px 0}.muted{color:#63756b;font-size:13px}.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}.line>*{min-width:0}select,input[type=text],input[type=number],input[type=date]{border:1px solid #c5d6cc;border-radius:9px;padding:10px;background:white;max-width:100%}.grow{flex:1}.tabs{display:flex;gap:5px}.tabs button{flex:1}.tabs .active{background:#146b48;color:white}.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(270px,.9fr);gap:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}}@media(min-width:761px){.layout{grid-template-columns:minmax(0,1.1fr) minmax(270px,.9fr)}}.field{position:relative;width:100%;aspect-ratio:0.85;background:repeating-linear-gradient(0deg,#237a49 0%,#237a49 12.5%,#278251 12.5%,#278251 25%);border:3px solid white;border-radius:8px;overflow:hidden;touch-action:pan-y}.field:before{content:'';position:absolute;inset:3%;border:2px solid #ffffff9c;pointer-events:none}.mid{position:absolute;top:50%;width:94%;left:3%;border-top:2px solid #ffffff9c}.circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:23%;aspect-ratio:1;border:2px solid #ffffff9c;border-radius:50%}.area{position:absolute;left:27%;width:46%;height:15%;border:2px solid #ffffff9c}.area.top{top:3%;border-top:0}.area.bottom{bottom:3%;border-bottom:0}.spot{position:absolute;transform:translate(-50%,-50%);width:68px;min-height:65px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;z-index:2;touch-action:none;user-select:none;cursor:grab}.avatar{height:43px;width:43px;border-radius:50%;background:#eaf4ed;border:3px solid white;box-shadow:0 2px 5px #0005;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#17583b;overflow:hidden}.avatar.empty{background:#ffffff36;color:white;border-style:dashed}.spot small{font-size:10px;color:white;text-shadow:0 1px 3px #000;max-width:86px;text-align:center;line-height:1.1;font-weight:700}.roster{max-height:380px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.person{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #edf1ed}.person .name{flex:1;font-size:13px}.person select{padding:6px;font-size:12px;max-width:88px}.handle{width:42px;height:42px;border-radius:50%;background:#d9ebdf;border:2px solid #9bc5a9;display:grid;place-items:center;font-weight:750;touch-action:none;user-select:none;flex-shrink:0;cursor:grab}.selected{outline:3px solid #f3bf43!important}.badge{background:#edf2ee;padding:5px 7px;border-radius:8px;font-size:12px}.good{background:#d6f2dc}.warn{background:#fff0c8}.danger{background:#ffe0df}.hidden{display:none!important}.listrow{padding:9px 3px;border-bottom:1px solid #e5ebe6;display:flex;align-items:center;gap:8px}.listrow>span:first-child{flex:1}.summary{width:100%;border-collapse:collapse;font-size:13px}.summary td,.summary th{border-bottom:1px solid #e5ece7;padding:9px 5px;text-align:center}.summary td:first-child,.summary th:first-child{text-align:left}.notice{background:#fff4d5;padding:10px;border-radius:10px;font-size:13px}.ghost{position:fixed;pointer-events:none;z-index:999;background:#f7faf7;border:2px solid #ffca45;border-radius:20px;padding:10px;font-weight:700;font-size:12px;box-shadow:0 3px 15px #0005}.drop{outline:4px solid #ffcb4e!important}footer{text-align:center;color:#73867a;padding:25px;font-size:12px}label{font-size:13px}input[type=file]{max-width:100%}
</style></head><body><header>ATLETICO ASCOLI <span style="font-size:13px;font-weight:500">v2.1 · Touch</span></header><nav id="nav"><button data-page="rosa" class="on">Convocati</button><button data-page="campo">Campo</button><button data-page="gara">Gara</button><button data-page="stat">Statistiche</button><button data-page="dati">Dati</button></nav><main class="wrap" id="app"><div class="panel">Caricamento dell'app…</div></main><footer>Atletico Ascoli · Versione touch per PC, tablet e smartphone · dati salvati su questo dispositivo quando consentito</footer><script>
(function(){'use strict';
const DEFAULT=['CHIERICONI RICCARDO','CIANCIO SAMUELE','CICCANTI LORENZO','CIVILOTTI TRISTAN','DI GIALLUCA TOMMASO','FIORETTI ALEX','GAGLIARDI GIULIO','GALANTI RICCARDO','GASPARI NICOLÒ','GRELLI RICCARDO','GUARNA ANDREA','PIGNOLONI MATTIA','QUARTARULLI LORENZO','ROMANELLI MANCINI LEONARDO','SCHITTULLI DIEGO ALDO','SCIAMANNA STEFANO','STIPA FRANCESCO','TRAVAGLIA MATTEO'];
const patterns={'3-2-3':[3,2,3],'2-3-2-1':[2,3,2,1],'3-3-2':[3,3,2]};
const fresh=()=>({players:DEFAULT.map((name,i)=>({id:i+1,name,role:'',called:true})),periods:Array.from({length:4},()=>({formation:'3-2-3',slots:Array(9).fill(null),events:[]})),home:'La nostra squadra',away:'Avversari',date:new Date().toISOString().slice(0,10)});
let data=fresh(),page='rosa',period=0,selected=null,drag=null,ocrNames=[],storageOK=true;
try{let s=localStorage.getItem('calcio9_new_v1');if(s){let d=JSON.parse(s);if(d&&Array.isArray(d.players)&&d.periods?.length===4)data=d}}catch(e){storageOK=false}
const el=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('calcio9_new_v1',JSON.stringify(data));storageOK=true}catch(e){storageOK=false}}
function player(id){return data.players.find(p=>p.id===id)}function short(id){let p=player(id);return p?p.name.split(' ')[0]:'+'}function counts(){return data.players.map(p=>data.periods.filter(t=>t.slots.includes(p.id)).length)}
function positions(mod){let rows=patterns[mod],res=[];rows.forEach((n,r)=>{let y=74-r*(56/Math.max(1,rows.length-1));for(let i=0;i<n;i++)res.push({x:50+(i-(n-1)/2)*(n===3?27:n===2?34:19),y})});res.push({x:50,y:91});return res}
function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function render(){try{el.innerHTML=page==='rosa'?rosa():page==='campo'?campo():page==='gara'?gara():page==='stat'?stats():dati();bind();}catch(e){el.innerHTML='<div class="panel"><h2>Errore nell’interfaccia</h2><p>'+esc(e.message)+'</p><button onclick="location.reload()">Riprova</button></div>'}}
function rosa(){return `<section class="panel"><h2>Convocati dalla fotografia</h2><p class="muted">Carica la foto. Il riconoscimento automatico richiede una connessione Internet e potrebbe non essere disponibile nell'anteprima locale. Puoi sempre incollare o correggere i nomi.</p><input type="file" id="photo" accept="image/*"><div class="line"><button id="ocr" class="primary">Leggi nomi dalla foto</button><span id="ocrStatus" class="muted"></span></div><img id="preview" alt="Foto caricata" style="max-width:100%;max-height:200px;display:none;border-radius:8px"><textarea id="namesText" style="width:100%;min-height:90px;border:1px solid #c5d6cc;border-radius:8px;padding:10px" placeholder="Un nome per riga, oppure incolla qui i nomi riconosciuti"></textarea><div class="line"><button id="importNames" class="primary">Importa nomi</button><button id="addName">Aggiungi manualmente</button></div></section><section class="panel"><h2>Rosa e convocazioni (${data.players.filter(p=>p.called).length})</h2><p class="muted">Seleziona chi è convocato. Assegna il ruolo una sola volta, rimarrà memorizzato.</p><div class="roster">${data.players.map(p=>`<div class="person"><input type="checkbox" data-called="${p.id}" ${p.called?'checked':''}><span class="name">${esc(p.name)}</span><select data-role="${p.id}">${['','P','D','C','A'].map(r=>`<option value="${r}" ${r===p.role?'selected':''}>${r||'Ruolo'}</option>`).join('')}</select><button data-rename="${p.id}" title="Modifica nome">✎</button></div>`).join('')}</div></section>`}
function campo(){let t=data.periods[period],pos=positions(t.formation),used=t.slots.filter(x=>x!==null),avail=data.players.filter(p=>p.called&&!used.includes(p.id)),cnt=counts();return `<section class="panel"><h2>Formazioni programmate</h2><div class="tabs">${data.periods.map((_,i)=>`<button data-period="${i}" class="${period===i?'active':''}">${i+1}° tempo</button>`).join('')}</div><div class="line"><label>Modulo <select id="formation">${Object.keys(patterns).map(m=>`<option ${m===t.formation?'selected':''}>${m}</option>`).join('')}</select></label><label>Copia dal tempo <select id="sourcePeriod">${data.periods.map((_,i)=>i===period?'':`<option value="${i}">${i+1}° tempo</option>`).join('')}</select></label><button id="copy" class="primary">Copia formazione</button></div><div class="notice"><b>Su Android:</b> tocca il nome di un convocato e poi il posto sul campo. <span id="selectionHint" style="display:block;font-weight:700;margin-top:5px">${selected!==null?'Selezionato: '+esc(player(selected)?.name||'')+'. Tocca una posizione sul campo.':'Nessun giocatore selezionato.'}</span> In alternativa trascina il <b>cerchietto</b> di un convocato su un posto fisso del campo. Se il posto è occupato, avviene uno scambio. Puoi anche toccare un cerchietto e poi la posizione desiderata.</div></section><div class="layout"><section class="panel"><div class="field" id="field"><div class="mid"></div><div class="circle"></div><div class="area top"></div><div class="area bottom"></div>${pos.map((pt,i)=>{let id=t.slots[i];return `<div class="spot" data-slot="${i}" data-dragid="${id??''}" style="left:${pt.x}%;top:${pt.y}%"><div class="avatar ${id===null?'empty':''} ${selected===id&&id!==null?'selected':''}">${id===null?'+':esc(initials(short(id)))}</div><small>${id===null?'Posto '+(i+1):esc(short(id))}</small></div>`}).join('')}</div><div class="line"><span class="badge ${used.length===9?'good':'warn'}">${used.length}/9 in campo</span><button id="clearPeriod">Svuota tempo</button></div></section><section class="panel"><h2>Disponibili (${avail.length})</h2><p class="muted">Scorri liberamente la lista. Il trascinamento parte solo dal cerchietto.</p><div class="roster">${avail.map(p=>`<div class="person"><div class="handle ${selected===p.id?'selected':''}" data-dragid="${p.id}">${esc(initials(p.name))}</div><button type="button" class="name ${selected===p.id?'selected':''}" data-pick="${p.id}" style="text-align:left;background:transparent;padding:10px 4px;min-height:44px">${esc(p.name)}</button><span class="badge ${cnt[data.players.indexOf(p)]===2?'good':''}">${cnt[data.players.indexOf(p)]}/4</span></div>`).join('')}</div><p class="muted">Per togliere un giocatore dal campo, tocca il suo cerchio e premi «Rimetti in panchina».</p><button id="bench" ${selected===null?'disabled':''}>Rimetti in panchina</button></section></div>${summary()}`}
function initials(n){return n.trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function summary(){let c=counts();return `<section class="panel"><h2>Tempi previsti per giocatore</h2><div style="overflow:auto"><table class="summary"><thead><tr><th>Giocatore</th><th>1°</th><th>2°</th><th>3°</th><th>4°</th><th>Totale</th></tr></thead><tbody>${data.players.filter(p=>p.called).map(p=>{let i=data.players.indexOf(p);return `<tr><td>${esc(p.name)}</td>${data.periods.map(t=>`<td>${t.slots.includes(p.id)?'✓':'·'}</td>`).join('')}<td><b class="badge ${c[i]===2?'good':c[i]===0?'danger':'warn'}">${c[i]}/4</b></td></tr>`}).join('')}</tbody></table></div></section>`}
function score(t){let s=[0,0];t.events.filter(e=>e.type==='goal').forEach(e=>s[e.team]++);return s}
function points(){return data.periods.reduce((a,t)=>{let s=score(t);if(s[0]>=s[1])a[0]++;if(s[1]>=s[0])a[1]++;return a},[0,0])}
function minutes(){let result={};data.players.forEach(p=>result[p.id]=0);data.periods.forEach(t=>{let active=new Set(t.slots.filter(Boolean));let last=0;let events=[...t.events].filter(e=>e.type==='sub').sort((a,b)=>a.min-b.min);function credit(to){let delta=Math.max(0,to-last);active.forEach(id=>result[id]=(result[id]||0)+delta);last=to}events.forEach(e=>{credit(e.min);active.delete(e.out);active.add(e.in)});credit(20)});return result}
function gara(){let t=data.periods[period],s=score(t),pt=points(),total=data.periods.reduce((a,p)=>{let x=score(p);return [a[0]+x[0],a[1]+x[1]]},[0,0]);return `<section class="panel"><h2>Consuntivo della gara</h2><div class="line"><input id="home" class="grow" value="${esc(data.home)}"><input id="away" class="grow" value="${esc(data.away)}"><input id="matchDate" type="date" value="${esc(data.date)}"></div><h2 style="text-align:center">${total[0]} : ${total[1]} <span class="muted">gol totali</span></h2><h2 style="text-align:center">${pt[0]} : ${pt[1]} <span class="muted">punti per tempi</span></h2><p class="muted" style="text-align:center">${pt[0]===pt[1]?'Gara pareggiata':pt[0]>pt[1]?'Vittoria':'Sconfitta'}. Ogni tempo vinto vale 1 punto; un pareggio vale 1 punto a entrambe.</p><table class="summary"><tr><th>Tempo</th><th>Gol nostri</th><th>Gol avversari</th><th>Punti</th></tr>${data.periods.map((p,i)=>{let x=score(p);return `<tr><td>${i+1}°</td><td>${x[0]}</td><td>${x[1]}</td><td>${x[0]>=x[1]?1:0}-${x[1]>=x[0]?1:0}</td></tr>`}).join('')}</table></section><section class="panel"><div class="tabs">${data.periods.map((_,i)=>`<button data-period="${i}" class="${period===i?'active':''}">${i+1}° tempo</button>`).join('')}</div><h3>Registra evento nel ${period+1}° tempo (0–20')</h3><div class="line"><label>Minuto <input id="minute" type="number" min="0" max="20" value="10" style="width:75px"></label><label>Evento <select id="eventType"><option value="sub">Sostituzione</option><option value="goal">Gol</option></select></label><label id="teamBox" class="hidden">Squadra <select id="goalTeam"><option value="0">Nostra</option><option value="1">Avversaria</option></select></label></div><div class="line" id="subInputs"><label>Esce <select id="outPlayer">${options(data.players.filter(p=>p.called))}</select></label><label>Entra <select id="inPlayer">${options(data.players.filter(p=>p.called))}</select></label></div><div class="line hidden" id="goalInputs"><label>Marcatore <select id="scorer"><option value="">Non specificato</option>${options(data.players.filter(p=>p.called))}</select></label></div><button class="primary" id="addEvent">Aggiungi evento</button><p class="muted">Le sostituzioni possono includere rientri. Inserisci gli eventi in ordine cronologico. I minuti vengono calcolati dai cambi registrati.</p><h3>Eventi del tempo</h3>${[...t.events].sort((a,b)=>a.min-b.min).map(e=>`<div class="listrow"><span>${e.min}' · ${e.type==='goal'?'⚽ '+(e.team===0?'Nostri':'Avversari')+' · '+(e.scorer?esc(player(e.scorer)?.name||''): 'marcatore non indicato'):'↔ '+esc(short(e.out))+' → '+esc(short(e.in))}</span><button data-deleteevent="${e.id}">Elimina</button></div>`).join('')||'<p class="muted">Nessun evento registrato.</p>'}</section>`}
function options(ps){return ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
function stats(){let m=minutes(),c=counts();return `<section class="panel"><h2>Statistiche individuali</h2><p class="muted">I tempi previsti sono quelli delle formazioni; i minuti effettivi derivano dalle sostituzioni registrate. Prima del consuntivo, i minuti sono provvisori.</p><div style="overflow:auto"><table class="summary"><tr><th>Giocatore</th><th>Tempi previsti</th><th>Minuti registrati</th><th>Gol</th></tr>${data.players.filter(p=>p.called).map(p=>`<tr><td>${esc(p.name)}</td><td>${c[data.players.indexOf(p)]}/4</td><td>${m[p.id]||0}/80</td><td>${data.periods.reduce((a,t)=>a+t.events.filter(e=>e.type==='goal'&&e.team===0&&e.scorer===p.id).length,0)}</td></tr>`).join('')}</table></div></section>${summary()}`}
function dati(){return `<section class="panel"><h2>Salvataggio e trasferimento</h2><p class="muted">${storageOK?'Il salvataggio locale è disponibile.':'Attenzione: il browser non consente il salvataggio locale. Esporta i dati prima di chiudere.'} Questa versione non sincronizza automaticamente dispositivi diversi.</p><div class="line"><button id="export" class="primary">Esporta partita (JSON)</button><label>Importa partita <input type="file" id="import" accept="application/json,.json"></label></div><div class="notice">Per condividere i dati tra iPad e iPhone, esporta il file e importalo sull'altro dispositivo. La sincronizzazione cloud richiederà una configurazione successiva.</div><h3>Nuova partita</h3><button id="resetGame">Azzera formazioni ed eventi (mantieni rosa)</button></section>`}
function bind(){document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=+b.dataset.period;selected=null;render()});if(page==='rosa')bindRosa();if(page==='campo')bindCampo();if(page==='gara')bindGara();if(page==='dati')bindDati()}
function bindRosa(){document.querySelectorAll('[data-called]').forEach(x=>x.onchange=()=>{let p=player(+x.dataset.called);p.called=x.checked;save();render()});document.querySelectorAll('[data-role]').forEach(x=>x.onchange=()=>{player(+x.dataset.role).role=x.value;save()});document.querySelectorAll('[data-rename]').forEach(x=>x.onclick=()=>{let p=player(+x.dataset.rename),v=prompt('Nome del giocatore',p.name);if(v?.trim()){p.name=v.trim().toUpperCase();save();render()}});document.getElementById('addName').onclick=()=>{let n=prompt('Nome e cognome');if(n?.trim()){data.players.push({id:nextId(),name:n.trim().toUpperCase(),role:'',called:true});save();render()}};document.getElementById('photo').onchange=e=>{let f=e.target.files[0];if(f){let img=document.getElementById('preview');img.src=URL.createObjectURL(f);img.style.display='block'}};document.getElementById('importNames').onclick=()=>{let a=document.getElementById('namesText').value.split(/\n/).map(x=>x.trim().replace(/^[-•\d.)\s]+/,'')).filter(x=>x.length>2);if(!a.length)return alert('Inserisci almeno un nome.');if(!confirm('Impostare '+a.length+' convocati per questa partita? I giocatori già registrati resteranno nella rosa.'))return;let known=new Map(data.players.map(p=>[p.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim(),p]));data.players.forEach(p=>p.called=false);for(let n of a){let key=n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();let p=known.get(key);if(!p){p={id:nextId(),name:n.toUpperCase(),role:'',called:true};data.players.push(p);known.set(key,p)}p.called=true}save();render()};document.getElementById('ocr').onclick=runOCR}
function nextId(){return Math.max(0,...data.players.map(p=>p.id))+1}
async function runOCR(){let f=document.getElementById('photo').files[0],status=document.getElementById('ocrStatus');if(!f)return alert('Seleziona prima una fotografia.');status.textContent='Caricamento riconoscimento…';try{if(!window.Tesseract){await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>no(new Error('Libreria OCR non raggiungibile'));document.head.appendChild(s)})}status.textContent='Lettura della fotografia…';let r=await Tesseract.recognize(f,'ita+eng');let lines=r.data.text.split(/\n/).map(x=>x.trim()).filter(x=>x.length>3);document.getElementById('namesText').value=lines.join('\n');status.textContent='Controlla e correggi i nomi prima di importarli.'}catch(e){status.textContent='Riconoscimento non disponibile: '+e.message+'. Puoi inserire i nomi manualmente.'}}
function selectForField(id){selected=id;render();let message=document.getElementById('selectionHint');if(message)message.textContent='Selezionato: '+(player(id)?.name||'')+'. Tocca una posizione sul campo.'}
function bindCampo(){document.getElementById('formation').onchange=e=>{data.periods[period].formation=e.target.value;save();render()};document.getElementById('copy').onclick=()=>{let src=+document.getElementById('sourcePeriod').value;if(!Number.isInteger(src)||src===period)return;let a=data.periods[src],b=data.periods[period];if(!confirm('Copiare modulo e giocatori del '+(src+1)+'° tempo nel '+(period+1)+'°?'))return;b.formation=a.formation;b.slots=[...a.slots];save();render()};document.getElementById('clearPeriod').onclick=()=>{if(confirm('Svuotare il tempo?')){data.periods[period].slots=Array(9).fill(null);save();render()}};document.getElementById('bench').onclick=()=>{let t=data.periods[period];t.slots=t.slots.map(id=>id===selected?null:id);selected=null;save();render()};document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>selectForField(+b.dataset.pick));document.querySelectorAll('[data-dragid]').forEach(n=>{n.addEventListener('pointerdown',startDrag);n.addEventListener('click',e=>{if(Date.now()-lastDragEnd<400)return;let id=+n.dataset.dragid;if(id){selectForField(id)}})});document.querySelectorAll('[data-slot]').forEach(n=>n.addEventListener('click',()=>{if(Date.now()-lastDragEnd<400)return;let slot=+n.dataset.slot;if(selected!==null){place(selected,slot);selected=null;render()}else{let id=data.periods[period].slots[slot];if(id!==null){selected=id;render()}}}))}
let lastDragEnd=0;
function place(id,slot){if(!player(id)?.called)return;let t=data.periods[period],old=t.slots.indexOf(id),other=t.slots[slot];if(old===slot)return;if(old>=0)t.slots[old]=other??null;t.slots[slot]=id;save()}
function startDrag(e){if(e.pointerType==='mouse'&&e.button!==0)return;let node=e.currentTarget,id=+node.dataset.dragid;if(!id)return;let x=e.clientX,y=e.clientY,started=false,ghost=null;node.setPointerCapture?.(e.pointerId);function move(ev){if(!started&&Math.hypot(ev.clientX-x,ev.clientY-y)>8){started=true;ghost=document.createElement('div');ghost.className='ghost';ghost.textContent=player(id)?.name||'';document.body.appendChild(ghost)}if(started){ev.preventDefault();ghost.style.left=(ev.clientX+12)+'px';ghost.style.top=(ev.clientY+12)+'px'}}function end(ev){node.removeEventListener('pointermove',move);node.removeEventListener('pointerup',end);node.removeEventListener('pointercancel',end);if(ghost)ghost.remove();if(started){lastDragEnd=Date.now();let target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-slot]');if(target){place(id,+target.dataset.slot);selected=null;render()}else{let field=document.getElementById('field');if(field&&field.contains(document.elementFromPoint(ev.clientX,ev.clientY))){selected=id;render()}}}}node.addEventListener('pointermove',move);node.addEventListener('pointerup',end);node.addEventListener('pointercancel',end)}
function bindGara(){['home','away','matchDate'].forEach(k=>document.getElementById(k).onchange=e=>{data[k==='matchDate'?'date':k]=e.target.value;save();render()});document.getElementById('eventType').onchange=e=>{let goal=e.target.value==='goal';document.getElementById('subInputs').classList.toggle('hidden',goal);document.getElementById('goalInputs').classList.toggle('hidden',!goal);document.getElementById('teamBox').classList.toggle('hidden',!goal)};document.getElementById('addEvent').onclick=()=>{let min=+document.getElementById('minute').value;if(!Number.isFinite(min)||min<0||min>20)return alert('Il minuto deve essere compreso tra 0 e 20.');let type=document.getElementById('eventType').value,e={id:Date.now()+Math.random(),type,min};if(type==='sub'){e.out=+document.getElementById('outPlayer').value;e.in=+document.getElementById('inPlayer').value;if(e.out===e.in)return alert('Seleziona due giocatori diversi.');let active=activeAt(data.periods[period],min);if(!active.has(e.out))return alert('Il giocatore uscente non risulta in campo al minuto indicato.');if(active.has(e.in))return alert('Il giocatore entrante risulta già in campo.')}else{e.team=+document.getElementById('goalTeam').value;e.scorer=e.team===0?+document.getElementById('scorer').value||null:null;if(e.scorer&&!activeAt(data.periods[period],min).has(e.scorer))return alert('Il marcatore non risulta in campo a quel minuto.')}data.periods[period].events.push(e);save();render()};document.querySelectorAll('[data-deleteevent]').forEach(b=>b.onclick=()=>{data.periods[period].events=data.periods[period].events.filter(e=>String(e.id)!==b.dataset.deleteevent);save();render()})}
function activeAt(t,min){let a=new Set(t.slots.filter(Boolean));[...t.events].filter(e=>e.type==='sub'&&e.min<=min).sort((a,b)=>a.min-b.min).forEach(e=>{a.delete(e.out);a.add(e.in)});return a}
function bindDati(){document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='calcio9-partita-'+data.date+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};document.getElementById('import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.players)||d.periods?.length!==4)throw Error('Formato non valido');if(confirm('Sostituire tutti i dati attuali con il file importato?')){data=d;save();render()}}catch(err){alert('Impossibile importare: '+err.message)}};document.getElementById('resetGame').onclick=()=>{if(confirm('Cancellare tutte le formazioni e gli eventi della partita?')){data.periods=Array.from({length:4},()=>({formation:'3-2-3',slots:Array(9).fill(null),events:[]}));save();render()}}}
render();
