---
layout: default
title: Contatti
description: Contatta l'Associazione Alma Tellus per informazioni, proposte e collaborazioni.
permalink: /contatti.html
---

<section class="page-shell">
  <header class="page-heading">
    <p class="eyebrow">Contatti</p>
    <h1>Scrivi ad Alma Tellus</h1>
    <p class="lead">
      Scrivi ad Alma Tellus per informazioni, proposte, collaborazioni
      o chiarimenti sul tesseramento.
    </p>
  </header>

  <form
    class="form-card form-grid"
    id="contact-form"
    method="POST"
    target="contact-frame"
    novalidate
  >
    <input type="hidden" name="form_type" value="contatti">
    <input type="hidden" name="source_page" value="contatti.html">
    <input type="hidden" name="page_version" value="v.2.0">
    <input type="hidden" name="submitted_at_client" id="submitted-at-client" value="">

    <label class="hp-field" aria-hidden="true">
      Non compilare questo campo
      <input type="text" name="website" tabindex="-1" autocomplete="off">
    </label>

    <div class="field-grid">
      <label>
        Nome e cognome *
        <input type="text" name="nome" autocomplete="name" required>
      </label>

      <label>
        Email *
        <input type="email" name="email" autocomplete="email" required>
      </label>
    </div>

    <label>
      Oggetto *
      <input type="text" name="oggetto" required>
    </label>

    <label>
      Messaggio *
      <textarea name="messaggio" rows="7" required></textarea>
    </label>

    <div class="checks">
      <label class="check-line">
        <input type="checkbox" name="privacy" value="Sì" required>
        <span>
          Dichiaro di aver preso visione delle informazioni relative al trattamento
          dei dati e autorizzo l’utilizzo dei dati inseriti per ricevere risposta
          alla mia richiesta.
        </span>
      </label>
    </div>

    <button id="contact-submit" class="btn btn-primary btn-submit" type="submit">
      Invia messaggio
    </button>

    <p id="contact-status" class="form-status" role="status" aria-live="polite"></p>
  </form>

  <iframe
    id="contact-frame"
    name="contact-frame"
    title="Invio contatto"
    hidden
  ></iframe>
</section>
